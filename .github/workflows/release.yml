name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate Secrets.xcconfig
        run: |
          cat > SonyCameraToGooglePhotos/Secrets.xcconfig <<EOF
          GOOGLE_CLIENT_ID = ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET = ${{ secrets.GOOGLE_CLIENT_SECRET }}
          EOF

      - name: Archive
        run: |
          xcodebuild -project SonyCameraToGooglePhotos/SonyCameraToGooglePhotos.xcodeproj \
            -scheme SonyCameraToGooglePhotos \
            -destination 'platform=macOS' \
            -configuration Release \
            -archivePath build/SonyCameraToGooglePhotos.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION=${{ steps.version.outputs.VERSION }} \
            archive

      - name: Create DMG
        run: |
          APP_PATH="build/SonyCameraToGooglePhotos.xcarchive/Products/Applications/SonyCameraToGooglePhotos.app"
          DMG_DIR="build/dmg"
          mkdir -p "$DMG_DIR"
          cp -R "$APP_PATH" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"
          hdiutil create -volname "Sony Camera to Google Photos" \
            -srcfolder "$DMG_DIR" \
            -ov -format UDZO \
            "build/SonyCameraToGooglePhotos-${{ steps.version.outputs.VERSION }}.dmg"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/SonyCameraToGooglePhotos-${{ steps.version.outputs.VERSION }}.dmg
          generate_release_notes: true
